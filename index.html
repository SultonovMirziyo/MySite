
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO'STLIK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login">
        <h1>DO'STLIK</h1>

        <input type="text" id="ism" placeholder="Ismingiz">

        <input type="tel" id="telefon" placeholder="Telefon nomer">

        <button onclick="boshlash()">BOSHLASH</button>
    </div>

    <script>
        function boshlash() {
            let ism = document.getElementById("ism").value;
            let telefon = document.getElementById("telefon").value;

            if (ism === "" || telefon === "") {
                alert("Iltimos, hamma joyni to'ldiring!");
                return;
            }

            localStorage.setItem("ism", ism);
            localStorage.setItem("telefon", telefon);

            window.location.href = "index2.html";
        }
    </script>

</body>
</html>
