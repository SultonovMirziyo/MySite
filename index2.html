
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telefon haqida</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>DO'STLIK</h1>
    <div class="cart" onclick="location.href='index3.html'">
        🛒 <span id="cartCount">0</span>
    </div>
</header>

<div class="detail">

    <div class="gallery">
        <img id="phoneImage" src="" alt="Telefon rasmi">
        <p class="hint">Rasmni surib, telefonning turli tomonlarini ko'ring</p>
        <div class="views">
            <button onclick="changeView(0)">Orqasi</button>
            <button onclick="changeView(1)">Oldi</button>
            <button onclick="changeView(2)">Yon tomoni</button>
        </div>
    </div>

    <div class="info">
        <h1 id="phoneName"></h1>
        <h2 id="phonePrice"></h2>

        <h3>Rangni tanlang:</h3>
        <div class="colors">
            <button class="color black" onclick="chooseColor(0)" aria-label="Qora"></button>
            <button class="color silver" onclick="chooseColor(1)" aria-label="Kumush"></button>
            <button class="color orange" onclick="chooseColor(2)" aria-label="To'q sariq"></button>
        </div>
        <p id="colorName">Qora</p>

        <h3>Kredit muddatini tanlang:</h3>

        <div class="credit-options">
            <button onclick="chooseCredit(3)" id="c3">3 oy</button>
            <button onclick="chooseCredit(6)" id="c6">6 oy</button>
            <button onclick="chooseCredit(12)" id="c12">12 oy</button>
        </div>

        <div class="credit-box">
            <p>Har oylik to'lov:</p>
            <h2 id="monthly"></h2>
            <p id="creditTotal"></p>
        </div>

        <button class="add-cart" onclick="addToCart(event)">
            🛒 SAVATGA QO'SHISH
        </button>
    </div>

</div>

<script>
const phones = [
    {name:"iPhone 18 Pro Max",price:25000000},
    {name:"iPhone 17 Pro Max",price:22000000},
    {name:"iPhone 16 Pro Max",price:18000000},
    {name:"iPhone 15 Pro Max",price:15000000}
];

const imageSets = [
    [
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-1.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-2.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-3.jpg"
    ],
    [
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-17-pro-max-1.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-17-pro-max-2.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-17-pro-max-3.jpg"
    ],
    [
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-1.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-2.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-16-pro-max-3.jpg"
    ],
    [
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-15-pro-max-1.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-15-pro-max-2.jpg",
      "https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-15-pro-max-3.jpg"
    ]
];

let selected = Number(localStorage.getItem("selectedProduct")) || 0;
let phone = phones[selected];
let color = 0;
let credit = 3;
let view = 0;

const colorNames = ["Qora","Kumush","To'q sariq"];

function money(number) {
    return number.toLocaleString("uz-UZ") + " so'm";
}

function render() {
    document.getElementById("phoneName").textContent = phone.name;
    document.getElementById("phonePrice").textContent = money(phone.price);
    document.getElementById("phoneImage").src = imageSets[selected][view];
    document.getElementById("colorName").textContent = colorNames[color];

    let total = phone.price * 1.20;
    let monthly = Math.ceil(total / credit);

    document.getElementById("monthly").textContent = money(monthly);
    document.getElementById("creditTotal").textContent =
        credit + " oyda jami: " + money(monthly * credit);

    [3,6,12].forEach(m => {
        document.getElementById("c"+m).classList.toggle("active",credit===m);
    });

    document.getElementById("cartCount").textContent =
        (JSON.parse(localStorage.getItem("savat")) || [])
        .reduce((sum,item)=>sum+item.qty,0);
}

function changeView(v) {
    view = v;
    render();
}

function chooseColor(c) {
    color = c;
    render();
}

function chooseCredit(c) {
    credit = c;
    render();
}

function addToCart(event) {
    let cart = JSON.parse(localStorage.getItem("savat")) || [];

    let item = cart.find(x =>
        x.id === selected && x.color === color && x.credit === credit
    );

    if(item) {
        item.qty++;
    } else {
        cart.push({
            id:selected,
            name:phone.name,
            price:phone.price,
            color:colorNames[color],
            credit:credit,
            monthly:Math.ceil(phone.price*1.20/credit),
            qty:1
        });
    }

    localStorage.setItem("savat",JSON.stringify(cart));

    let button = event.currentTarget;
    button.classList.add("added");
    button.textContent = "✓ SAVATGA QO'SHILDI";

    setTimeout(() => {
        button.classList.remove("added");
        button.textContent = "🛒 SAVATGA QO'SHISH";
    },1200);

    render();
}

render();

// Rasmni barmoq yoki sichqoncha bilan surish
let startX = 0;
const gallery = document.querySelector(".gallery");

gallery.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

gallery.addEventListener("touchend", e => {
    let diff = e.changedTouches[0].clientX - startX;
    if(Math.abs(diff)>40) {
        view = (view + 1) % 3;
        render();
    }
});

gallery.addEventListener("mousedown", e => startX = e.clientX);
gallery.addEventListener("mouseup", e => {
    let diff = e.clientX - startX;
    if(Math.abs(diff)>40) {
        view = (view + 1) % 3;
        render();
    }
});
</script>

</body>
</html>
