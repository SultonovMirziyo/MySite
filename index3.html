
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyurtma - DO'STLIK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>DO'STLIK SAVDO MARKAZI</h1>
</header>

<div class="checkout">
    <h1>🛒 SAVAT</h1>

    <div id="items"></div>

    <hr>

    <h2 id="total"></h2>

    <h3>Mijoz ma'lumotlari</h3>
    <p>Ism: <span id="customer"></span></p>
    <p>Telefon: <span id="customerPhone"></span></p>

    <h3>Do'kon telefon raqami</h3>
    <h2>+998 93 340 20 80</h2>

    <button onclick="sendOrder()">BUYURTMA BERISH</button>

    <br><br>
    <button onclick="location.href='index2.html'">XARIDNI DAVOM ETTIRISH</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("savat")) || [];

document.getElementById("customer").textContent =
    localStorage.getItem("ism") || "Mehmon";

document.getElementById("customerPhone").textContent =
    localStorage.getItem("telefon") || "Kiritilmagan";

let total = 0;
let items = document.getElementById("items");

cart.forEach((item,index) => {
    let price = item.price * item.qty;
    let creditTotal = item.monthly * item.credit * item.qty;

    total += creditTotal;

    items.innerHTML += `
        <div class="order-item">
            <h3>${item.name}</h3>
            <p>Rang: ${item.color}</p>
            <p>Soni: ${item.qty} ta</p>
            <p>Naqd narxi: ${price.toLocaleString("uz-UZ")} so'm</p>
            <p>Kredit: ${item.credit} oy</p>
            <p>Har oylik: ${item.monthly.toLocaleString("uz-UZ")} so'm</p>
            <p>Jami kredit: ${creditTotal.toLocaleString("uz-UZ")} so'm</p>
            <button onclick="removeItem(${index})">O'CHIRISH</button>
        </div>
    `;
});

document.getElementById("total").textContent =
    "Umumiy kredit summasi: " + total.toLocaleString("uz-UZ") + " so'm";

function removeItem(index) {
    cart.splice(index,1);
    localStorage.setItem("savat",JSON.stringify(cart));
    location.reload();
}

function sendOrder() {
    if(cart.length === 0) {
        alert("Savatingiz bo'sh!");
        return;
    }

    let message = "DO'STLIK SAVDO MARKAZI BUYURTMASI\n";
    message += "Mijoz: " + (localStorage.getItem("ism") || "Mehmon") + "\n";
    message += "Mijoz telefoni: " + (localStorage.getItem("telefon") || "Yo'q") + "\n\n";

    cart.forEach(item => {
        message += item.name + "\n";
        message += "Rang: " + item.color + "\n";
        message += "Soni: " + item.qty + "\n";
        message += "Kredit: " + item.credit + " oy\n";
        message += "Oylik to'lov: " +
            item.monthly.toLocaleString("uz-UZ") + " so'm\n\n";
    });

    message += "JAMI: " + total.toLocaleString("uz-UZ") + " so'm";

    let smsURL = "sms:+998933402080?body=" + encodeURIComponent(message);

    window.location.href = smsURL;
}
</script>

</body>
</html>
